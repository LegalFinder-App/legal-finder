name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # The app (Android / iOS / desktop) is its own package with its own lint and type-check.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # expo-env.d.ts and .expo/types (typed routes, the web-only Pressable states the desktop
      # layout uses) are generated, not committed; a clean checkout doesn't typecheck without them.
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint

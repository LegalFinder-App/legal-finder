name: Mobile — iOS build

# There's no Xcode on the machine this repo was scaffolded from, so the iOS app has never
# actually been built — only generated (see platforms/mobile/ios/README.md). This workflow does
# a real build on GitHub's hosted macOS runner. Runs on-demand only, since macOS-runner minutes
# are the most expensive tier.
#
# Out of the box this does an UNSIGNED simulator build — enough to prove the Capacitor/Xcode
# pipeline actually compiles, but not something App Store Connect will accept. Real submission
# needs an Apple Developer Program membership (separate from a plain Apple ID) plus a
# provisioning profile and distribution certificate; add these repository secrets and swap in
# the commented-out archive/export steps below once you have them:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  — same as the desktop macOS workflow
#   IOS_DIST_SIGNING_CERT_P12   — base64-encoded .p12 distribution certificate
#   IOS_DIST_SIGNING_CERT_PASSWORD
#   IOS_PROVISIONING_PROFILE    — base64-encoded .mobileprovision file
# See platforms/mobile/ios/README.md for the full walkthrough (provisioning profile creation,
# App Store Connect API key, Transporter upload).

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        working-directory: platforms/mobile
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: npx cap sync ios

      # Unsigned build for CI health-checking only — proves the project compiles. Replace with a
      # real `xcodebuild archive` + `xcodebuild -exportArchive` (using the secrets listed above)
      # once you're ready to produce an actual App Store Connect submission.
      - name: Build (unsigned, simulator destination)
        working-directory: platforms/mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

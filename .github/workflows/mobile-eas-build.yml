name: Mobile — EAS build

# Queues a cloud build of the native app (apps/mobile) on Expo's EAS Build — the way to produce the
# iOS app without a Mac. The build itself runs on Expo's servers (`--no-wait`), so this job only
# takes a minute; follow it at expo.dev.
#
# One-time setup, done from a terminal because Apple's login is interactive (apps/mobile/README.md,
# "iOS / cloud builds"):
#   1. `npx eas-cli@latest init` in apps/mobile, and put the project id in app.config.ts
#   2. one successful `eas build` per platform, so EAS has the signing credentials
#   3. the EXPO_PUBLIC_* values added as EAS environment variables for the profile's environment
# Then add the repository SECRET `EXPO_TOKEN` (expo.dev → Account settings → Access tokens).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: Build profile (apps/mobile/eas.json)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install the app
        working-directory: apps/mobile
        run: npm ci

      - name: Queue the build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

# Packaging config for the LegalFinder desktop app (see electron/main.js). Two things go into each
# installer: the shell (electron/main.js + preload.js) and the app itself — the web export of
# apps/mobile, copied to resources/web, which the shell serves through app://. Nothing is loaded
# from the website.
#
# Run from the repo root via the npm scripts in package.json — they export the app first:
#   npm run desktop:dist:win
#   npm run desktop:dist:linux
#   npm run desktop:dist:mac      (only produces a real artifact on macOS — see platforms/desktop/macos/README.md)
appId: com.legalfinder.desktop
productName: LegalFinder
directories:
  app: platforms/desktop/electron
  output: platforms/desktop/release

# The shell is these three files and has no dependencies of its own. Without the exclusion,
# electron-builder falls back to the repo root's package.json and packs the whole website's
# node_modules (180 MB of server and web libraries) into the app.
files:
  - main.js
  - preload.js
  - package.json
  - "!**/node_modules/**"

# The app's own code: `npm run desktop:web` (expo export --platform web) writes it here.
extraResources:
  - from: apps/mobile/dist/desktop
    to: web

# legalfinder:// links come back to the app after Google/Apple/LinkedIn sign-in and Pesapal
# checkout (same scheme as the phone apps). This declares it for the macOS and Linux packages; on
# Windows main.js registers it when the app first runs.
protocols:
  - name: LegalFinder
    schemes:
      - legalfinder

artifactName: "LegalFinder-${version}-${os}-${arch}.${ext}"

# Windows uses a pre-generated .ico (platforms/shared/icons/icon.ico, built by
# `node -e "require('png-to-ico')..."` from source-icon.png — see platforms/shared/README.md)
# rather than letting electron-builder auto-convert the PNG: that auto-conversion needs to
# download its winCodeSign helper tool, which timed out on this network. macOS's icns conversion
# runs through the OS's own built-in iconutil when built on real macOS, so it doesn't hit the
# same issue — mac.icon below can stay pointed at the plain PNG source.
win:
  target:
    - nsis
  icon: platforms/shared/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

linux:
  target:
    - AppImage
    - deb
  icon: platforms/shared/icons/source-icon.png
  category: Office

mac:
  target:
    - dmg
    - zip
  icon: platforms/shared/icons/source-icon.png
  category: public.app-category.business
  # Real notarization needs an Apple Developer account — see .github/workflows/desktop-build.yml
  # and platforms/desktop/macos/README.md for the secrets/steps required.
  hardenedRuntime: true
